syntax = "proto3";
package raft;

option go_package = "github.com/SagarSingh2003/server/raft_proto";

service Raft{
    rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse) {}
    rpc RequestVote (RequestVoteMessage) returns (RequestVoteResponse) {}
    rpc ClientOperation (ClientOperationRequest) returns (ClientOperationResponse) {}
}

message ClientOperationRequest{
    string requestId = 6;
    string namespace = 1;
    string operation = 2;
    string key = 3;
    string value = 4;
    string casValue = 5;
}

message ClientOperationResponse{
    bool success = 1;
    string error = 2;
    string value = 3;
    string LeaderId = 4;
}

message AppendEntriesRequest{
    int32 term = 1;
    string leaderId = 2;
    int32 prevLogIndex = 3;
    int32 prevLogTerm = 4;
    repeated string entries = 5;
    int32 leaderCommit = 6;
}

message AppendEntriesResponse{
    int32 term = 1;
    bool success = 2; 
}

message RequestVoteMessage{
    int32 term = 1;
    string candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

message RequestVoteResponse{
    int32 term = 1;
    bool voteGranted = 2; 
}